<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Voxel Pagoda Garden</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            overflow: hidden;
            background: #7ec8e3;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.55);
            padding: 8px 20px;
            border-radius: 25px;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        #title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 20px;
            border-radius: 25px;
            pointer-events: none;
            z-index: 10;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>
    <div id="info">🖱️ Drag to rotate &nbsp;|&nbsp; 🔍 Scroll to zoom</div>
    <div id="title">🌸 Voxel Pagoda Garden</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js">
    </script>

    <script>
        // ============================================================
        // SCENE SETUP
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec8e3);
        scene.fog = new THREE.FogExp2(0x7ec8e3, 0.004);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(38, 28, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 4, 0);
        controls.minDistance = 10;
        controls.maxDistance = 120;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.update();

        // ============================================================
        // LIGHTING
        // ============================================================
        const ambientLight = new THREE.AmbientLight(0xbfd9ff, 0.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffe8c8, 0.9);
        sunLight.position.set(25, 35, 15);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 100;
        sunLight.shadow.camera.left = -35;
        sunLight.shadow.camera.right = 35;
        sunLight.shadow.camera.top = 35;
        sunLight.shadow.camera.bottom = -35;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x88aaff, 0.35);
        fillLight.position.set(-20, 10, -15);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xffaa88, 0.25);
        rimLight.position.set(0, 5, -30);
        scene.add(rimLight);

        // ============================================================
        // HELPER FUNCTIONS
        // ============================================================
        const VS = 0.7; // Voxel size

        function createVoxel(x, y, z, color, opts = {}) {
            const geo = new THREE.BoxGeometry(VS * 0.92, VS * 0.92, VS * 0.92);
            const mat = new THREE.MeshLambertMaterial({ color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            if (opts.castShadow !== false) mesh.castShadow = true;
            if (opts.receiveShadow !== false) mesh.receiveShadow = true;
            scene.add(mesh);
            return mesh;
        }

        function voxelColor(baseColor, variation) {
            const c = new THREE.Color(baseColor);
            c.r += (Math.random() - 0.5) * variation;
            c.g += (Math.random() - 0.5) * variation;
            c.b += (Math.random() - 0.5) * variation;
            return c;
        }

        // ============================================================
        // GROUND
        // ============================================================
        const groundSize = 60;
        const groundCount = groundSize * groundSize;
        const groundGeo = new THREE.BoxGeometry(VS * 0.95, VS * 0.6, VS * 0.95);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
        const groundMesh = new THREE.InstancedMesh(groundGeo, groundMat, groundCount);
        const dummy = new THREE.Object3D();
        const tempColor = new THREE.Color();

        let gi = 0;
        for (let ix = -groundSize / 2; ix < groundSize / 2; ix++) {
            for (let iz = -groundSize / 2; iz < groundSize / 2; iz++) {
                dummy.position.set(ix * VS + VS / 2, -VS * 0.3, iz * VS + VS / 2);
                dummy.updateMatrix();
                groundMesh.setMatrixAt(gi, dummy.matrix);
                // Green variation
                const g = 0.35 + Math.random() * 0.2;
                const r = 0.15 + Math.random() * 0.15;
                const b = 0.1 + Math.random() * 0.1;
                tempColor.setRGB(r, g, b);
                groundMesh.setColorAt(gi, tempColor);
                gi++;
            }
        }
        groundMesh.instanceMatrix.needsUpdate = true;
        groundMesh.instanceColor.needsUpdate = true;
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);

        // ============================================================
        // PAGODA
        // ============================================================

        // Base platform
        const baseSize = 5;
        for (let x = -baseSize; x < baseSize; x++) {
            for (let z = -baseSize; z < baseSize; z++) {
                createVoxel(x * VS, 0, z * VS, 0x8a8a7a);
                createVoxel(x * VS, VS, z * VS, 0x7a7a6a);
            }
        }
        // Platform edge detail
        for (let x = -baseSize; x <= baseSize; x++) {
            createVoxel(x * VS, 0, -baseSize * VS, 0x6a6a5a);
            createVoxel(x * VS, 0, baseSize * VS, 0x6a6a5a);
            createVoxel(x * VS, VS, -baseSize * VS, 0x6a6a5a);
            createVoxel(x * VS, VS, baseSize * VS, 0x6a6a5a);
        }
        for (let z = -baseSize; z <= baseSize; z++) {
            createVoxel(-baseSize * VS, 0, z * VS, 0x6a6a5a);
            createVoxel(baseSize * VS, 0, z * VS, 0x6a6a5a);
            createVoxel(-baseSize * VS, VS, z * VS, 0x6a6a5a);
            createVoxel(baseSize * VS, VS, z * VS, 0x6a6a5a);
        }

        // Pagoda tier function
        function createTier(cx, cz, wallHalf, wallHeight, wallColor, roofHalf, roofColor) {
            // Walls
            for (let x = -wallHalf; x < wallHalf; x++) {
                for (let z = -wallHalf; z < wallHalf; z++) {
                    if (x === -wallHalf || x === wallHalf - 1 || z === -wallHalf || z === wallHalf - 1) {
                        for (let y = 0; y < wallHeight; y++) {
                            createVoxel(cx + x * VS, 2 * VS + y * VS, cz + z * VS, wallColor);
                        }
                    }
                }
            }
            // Interior walls (fill)
            for (let x = -wallHalf + 1; x < wallHalf - 1; x++) {
                for (let z = -wallHalf + 1; z < wallHalf - 1; z++) {
                    for (let y = 0; y < wallHeight - 1; y++) {
                        createVoxel(cx + x * VS, 2 * VS + y * VS, cz + z * VS, 0x3a2a1a);
                    }
                }
            }
            // Roof
            const roofY = 2 * VS + wallHeight * VS;
            for (let x = -roofHalf; x < roofHalf; x++) {
                for (let z = -roofHalf; z < roofHalf; z++) {
                    createVoxel(cx + x * VS, roofY, cz + z * VS, roofColor);
                }
            }
            // Roof raised edges
            for (let x = -roofHalf; x < roofHalf; x++) {
                createVoxel(cx + x * VS, roofY + VS, cz - roofHalf * VS, roofColor);
                createVoxel(cx + x * VS, roofY + VS, cz + (roofHalf - 1) * VS, roofColor);
            }
            for (let z = -roofHalf; z < roofHalf; z++) {
                createVoxel(cx - roofHalf * VS, roofY + VS, cz + z * VS, roofColor);
                createVoxel(cx + (roofHalf - 1) * VS, roofY + VS, cz + z * VS, roofColor);
            }
            // Corners up higher
            const cornerOffsets = [
                [-roofHalf, -roofHalf],
                [roofHalf - 1, -roofHalf],
                [-roofHalf, roofHalf - 1],
                [roofHalf - 1, roofHalf - 1]
            ];
            cornerOffsets.forEach(([ox, oz]) => {
                createVoxel(cx + ox * VS, roofY + 2 * VS, cz + oz * VS, roofColor);
            });
            // Extra corner tips
            cornerOffsets.forEach(([ox, oz]) => {
                createVoxel(cx + ox * VS, roofY + 2.5 * VS, cz + oz * VS, 0xffcc44);
            });

            return roofY + 3 * VS;
        }

        // Tier 1
        let yPos = createTier(0, 0, 3, 3, 0x8b2a2a, 5, 0x2a3a5a);
        // Tier 2
        yPos = createTier(0, 0, 2, 2, 0x8b2a2a, 4, 0x2a3a5a);
        // Tier 3
        yPos = createTier(0, 0, 1, 2, 0x8b2a2a, 3, 0x2a3a5a);

        // Spire
        for (let i = 0; i < 4; i++) {
            createVoxel(0, yPos + i * VS, 0, 0xffcc44);
        }
        createVoxel(0, yPos + 4 * VS, 0, 0xffaa22);
        createVoxel(0, yPos + 5 * VS, 0, 0xffdd66);

        // Pagoda door
        createVoxel(0, 2 * VS, -3 * VS, 0x3a2a1a);
        createVoxel(0, 3 * VS, -3 * VS, 0x3a2a1a);

        // ============================================================
        // CHERRY BLOSSOM TREES
        // ============================================================
        function createCherryTree(px, pz, scale = 1) {
            const trunkH = Math.round(4 * scale);
            // Trunk
            for (let i = 0; i < trunkH; i++) {
                createVoxel(px, i * VS, pz, 0x5a3a1a);
                if (scale > 1.2) {
                    createVoxel(px + VS * 0.3, i * VS, pz + VS * 0.2, 0x4a2a0a);
                }
            }
            // Canopy
            const radius = Math.round(2.5 * scale);
            const baseY = trunkH * VS;
            for (let dx = -radius; dx <= radius; dx++) {
                for (let dz = -radius; dz <= radius; dz++) {
                    for (let dy = 0; dy < Math.round(2 * scale); dy++) {
                        const dist = Math.sqrt(dx * dx + dz * dz + (dy - scale) * (dy - scale));
                        if (dist <= radius * 0.9) {
                            const r = Math.random();
                            let color;
                            if (r < 0.5) color = 0xffb7c5;
                            else if (r < 0.75) color = 0xff8fac;
                            else if (r < 0.9) color = 0xffe0e8;
                            else color = 0xff6b8a;
                            createVoxel(px + dx * VS, baseY + dy * VS, pz + dz * VS, color);
                        }
                    }
                }
            }
            // Some scattered blossom particles
            for (let i = 0; i < 15; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = radius * VS * (0.8 + Math.random() * 0.5);
                const x = px + Math.cos(angle) * dist;
                const z = pz + Math.sin(angle) * dist;
                const y = baseY + Math.random() * radius * VS * 0.5;
                createVoxel(x, y, z, 0xffb7c5);
            }
        }

        // Place trees
        createCherryTree(-8, -6, 1.2);
        createCherryTree(10, -8, 0.8);
        createCherryTree(-10, 8, 1.0);
        createCherryTree(12, 6, 0.9);
        createCherryTree(-4, -14, 0.7);
        createCherryTree(16, -2, 0.7);

        // ============================================================
        // POND
        // ============================================================
        const pondCenter = { x: -10, z: 12 };
        for (let dx = -4; dx <= 4; dx++) {
            for (let dz = -4; dz <= 4; dz++) {
                const dist = Math.sqrt(dx * dx + dz * dz);
                if (dist <= 4) {
                    const depth = Math.max(1, Math.round(4 - dist));
                    for (let d = 0; d < depth; d++) {
                        const color = d === 0 ? 0x2288bb : 0x1a6a9a;
                        createVoxel(pondCenter.x + dx * VS, d * VS, pondCenter.z + dz * VS, color);
                    }
                    // Surface shimmer
                    if (dist < 3.5 && Math.random() < 0.3) {
                        createVoxel(pondCenter.x + dx * VS, depth * VS + VS * 0.3, pondCenter.z + dz * VS, 0x55ccdd);
                    }
                }
            }
        }
        // Lily pads
        for (let i = 0; i < 3; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = 2 + Math.random() * 1.5;
            const lx = pondCenter.x + Math.cos(angle) * r;
            const lz = pondCenter.z + Math.sin(angle) * r;
            createVoxel(lx, 1.2 * VS, lz, 0x2d8b3a);
            createVoxel(lx + VS * 0.3, 1.2 * VS, lz + VS * 0.3, 0x3da04a);
        }
        // Stones in pond
        createVoxel(pondCenter.x + 1 * VS, 1.2 * VS, pondCenter.z + 1 * VS, 0x6a6a6a);
        createVoxel(pondCenter.x - 2 * VS, 1.2 * VS, pondCenter.z + 0.5 * VS, 0x5a5a5a);

        // ============================================================
        // STONE PATH
        // ============================================================
        // Path from edge to pagoda
        const pathPoints = [
            { x: 22, z: 0 },
            { x: 18, z: 0 },
            { x: 14, z: 0 },
            { x: 10, z: 0 },
            { x: 6, z: 0 },
            { x: 3, z: 0 },
            { x: 0, z: 0 }
        ];

        for (let i = 0; i < pathPoints.length; i++) {
            const p = pathPoints[i];
            createVoxel(p.x * VS, 0, p.z * VS, 0x8a8a8a);
            createVoxel(p.x * VS + VS * 0.3, 0, p.z * VS + VS * 0.3, 0x7a7a7a);
            if (i > 0) {
                createVoxel((p.x + pathPoints[i - 1].x) * VS / 2, 0, (p.z + pathPoints[i - 1].z) * VS / 2, 0x8a8a8a);
            }
        }

        // Curved path segment
        const pathCurve = [
            { x: 22, z: -2 },
            { x: 20, z: -3 },
            { x: 18, z: -2 },
            { x: 16, z: 0 },
        ];
        for (const p of pathCurve) {
            createVoxel(p.x * VS, 0, p.z * VS, 0x8a8a8a);
        }

        // ============================================================
        // FLOWERS
        // ============================================================
        const flowerColors = [0xff4488, 0xffaa44, 0xaa44ff, 0x44ffaa, 0xff6666, 0xffff44, 0xff88cc];

        function createFlowerPatch(cx, cz, size) {
            for (let i = 0; i < size; i++) {
                const ox = cx + (Math.random() - 0.5) * 3 * VS;
                const oz = cz + (Math.random() - 0.5) * 3 * VS;
                const color = flowerColors[Math.floor(Math.random() * flowerColors.length)];
                createVoxel(ox, VS * 0.4, oz, color);
                // Flower stem
                createVoxel(ox, VS * 0.1, oz, 0x2d5a1a);
            }
        }

        createFlowerPatch(4, -8, 5);
        createFlowerPatch(-6, -12, 4);
        createFlowerPatch(14, 4, 3);
        createFlowerPatch(-14, -4, 4);
        createFlowerPatch(6, 14, 3);

        // ============================================================
        // LANTERNS
        // ============================================================
        function createLantern(px, pz) {
            // Post
            for (let i = 0; i < 4; i++) {
                createVoxel(px, i * VS, pz, 0x4a3a2a);
            }
            // Lantern body
            createVoxel(px, 4 * VS, pz, 0xcc3322);
            createVoxel(px, 4.7 * VS, pz, 0xff6644);
            createVoxel(px, 5.4 * VS, pz, 0xcc3322);
            // Light glow effect
            createVoxel(px + VS * 0.3, 4.7 * VS, pz, 0xffaa44);
            createVoxel(px - VS * 0.3, 4.7 * VS, pz, 0xffaa44);
            createVoxel(px, 4.7 * VS, pz + VS * 0.3, 0xffaa44);
            createVoxel(px, 4.7 * VS, pz - VS * 0.3, 0xffaa44);
        }

        createLantern(8, -4);
        createLantern(-6, 6);
        createLantern(4, 10);

        // ============================================================
        // ROCKS & DECORATIONS
        // ============================================================
        function createRock(px, pz, size) {
            for (let x = 0; x < size; x++) {
                for (let z = 0; z < size; z++) {
                    for (let y = 0; y < Math.max(1, size - 1); y++) {
                        if (Math.random() < 0.85) {
                            createVoxel(px + x * VS * 0.5, y * VS * 0.5, pz + z * VS * 0.5, 0x7a7a6a);
                        }
                    }
                }
            }
        }

        createRock(3, -12, 2);
        createRock(-13, -8, 1);
        createRock(18, 10, 1);
        createRock(-18, -14, 2);

        // ============================================================
        // FALLEN CHERRY BLOSSOM PETALS ON GROUND
        // ============================================================
        for (let i = 0; i < 80; i++) {
            const px = (Math.random() - 0.5) * 50 * VS;
            const pz = (Math.random() - 0.5) * 50 * VS;
            // Don't place on pond
            const dx = px / VS - pondCenter.x;
            const dz = pz / VS - pondCenter.z;
            if (Math.sqrt(dx * dx + dz * dz) < 4.5) continue;
            const petalColors = [0xffb7c5, 0xff8fac, 0xffe0e8, 0xffccdd];
            const color = petalColors[Math.floor(Math.random() * petalColors.length)];
            createVoxel(px, VS * 0.1, pz, color);
        }

        // ============================================================
        // GRASS TUFTS
        // ============================================================
        for (let i = 0; i < 40; i++) {
            const px = (Math.random() - 0.5) * 40 * VS;
            const pz = (Math.random() - 0.5) * 40 * VS;
            const dx = px / VS - pondCenter.x;
            const dz = pz / VS - pondCenter.z;
            if (Math.sqrt(dx * dx + dz * dz) < 4.5) continue;
            if (Math.abs(px) < 6 * VS && Math.abs(pz) < 6 * VS) continue;
            createVoxel(px, VS * 0.35, pz, 0x3d8b3a);
            createVoxel(px + VS * 0.25, VS * 0.35, pz + VS * 0.25, 0x4da04a);
        }

        // ============================================================
        // PAGODA STEP DETAIL
        // ============================================================
        for (let i = 0; i < 4; i++) {
            createVoxel(-i * VS, VS * 0.5, -4 * VS, 0x8a8a7a);
            createVoxel(i * VS, VS * 0.5, -4 * VS, 0x8a8a7a);
        }

        // ============================================================
        // ANIMATION LOOP
        // ============================================================
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Gentle camera sway
            // controls.target.y = 4 + Math.sin(time * 0.3) * 0.3;

            controls.update();
            renderer.render(scene, camera);
        }

        // Window resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        animate();

        // ============================================================
        // ADD SOME PARTICLE EFFECT (FALLING PETALS)
        // ============================================================
        const petalGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const petalMat = new THREE.MeshLambertMaterial({ color: 0xffb7c5, transparent: true, opacity: 0.8 });
        const petalCount = 60;
        const petals = [];

        for (let i = 0; i < petalCount; i++) {
            const petal = new THREE.Mesh(petalGeo, petalMat);
            petal.position.set(
                (Math.random() - 0.5) * 40,
                Math.random() * 20 + 5,
                (Math.random() - 0.5) * 40
            );
            petal.castShadow = false;
            scene.add(petal);
            petals.push({
                mesh: petal,
                speed: 0.02 + Math.random() * 0.04,
                rotSpeed: Math.random() * 2,
                swing: Math.random() * Math.PI * 2,
                swingSpeed: 0.5 + Math.random() * 0.5
            });
        }

        // Override animate to include petals
        const originalAnimate = animate;
        let petalTime = 0;

        function animateWithPetals() {
            requestAnimationFrame(animateWithPetals);
            petalTime += 0.016;

            petals.forEach((p) => {
                p.mesh.position.y -= p.speed;
                p.mesh.rotation.x += p.rotSpeed * 0.02;
                p.mesh.rotation.z += p.rotSpeed * 0.01;
                p.mesh.position.x += Math.sin(petalTime * p.swingSpeed + p.swing) * 0.02;
                p.mesh.position.z += Math.cos(petalTime * p.swingSpeed * 0.7 + p.swing) * 0.02;

                if (p.mesh.position.y < 0) {
                    p.mesh.position.y = 15 + Math.random() * 5;
                    p.mesh.position.x = (Math.random() - 0.5) * 35;
                    p.mesh.position.z = (Math.random() - 0.5) * 35;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        // Replace animate with petal version
        // Cancel the original animation
        // We need to override
        cancelAnimationFrame(animate);

        // Restart with petal animation
        animateWithPetals();
    </script>
</body>
</html>
